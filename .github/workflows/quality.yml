name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Verify Tailwind utilities
        run: npm run verify:tailwind-utilities
      - name: Verify Directus HTML
        run: npm run verify:directus-html
      - name: Verify Directus fetch policy
        run: npm run verify:directus-fetch-policy
      - name: Verify FAQ HTML
        run: npm run verify:faq-html
      - name: Verify person HTML
        run: npm run verify:person-html
      - name: Verify sponsor HTML
        run: npm run verify:sponsor-html
      - name: Verify person SEO
        run: npm run verify:person-seo
      - name: Verify JSON-LD serialization
        run: npm run verify:json-ld
      - name: Verify glossary HTML
        run: npm run verify:glossary-html
      - name: Verify glossary route policy
        run: npm run verify:glossary-policy
      - name: Verify special-offer indexing
        run: npm run verify:special-offer-indexing
      - name: Verify build-only revalidation
        run: npm run verify:build-only-revalidation
